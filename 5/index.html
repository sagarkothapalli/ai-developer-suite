<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptForge — AI Prompt Engineer</title>
    <meta name="description" content="Optimize and refine your AI prompts for better results. Analyze prompt strength and get instant improvements.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-tertiary: #1e293b;
            --bg-card: rgba(17, 24, 39, 0.75);
            --border: rgba(236, 72, 153, 0.15);
            --border-hover: rgba(236, 72, 153, 0.35);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #ec4899;
            --accent-light: #f472b6;
            --accent-glow: rgba(236, 72, 153, 0.25);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --radius: 14px;
            --radius-sm: 8px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 600px 400px at 15% 15%, rgba(236, 72, 153, 0.06), transparent),
                radial-gradient(ellipse 500px 500px at 85% 85%, rgba(59, 130, 246, 0.04), transparent);
            pointer-events: none;
            z-index: 0;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 14, 26, 0.88);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
        }

        .header-inner {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), #db2777);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-badge {
            padding: 3px 8px;
            background: rgba(236, 72, 153, 0.1);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--accent-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #db2777, var(--accent));
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 25px var(--accent-glow);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        /* Main Layout */
        .main {
            position: relative;
            z-index: 1;
            max-width: 1300px;
            margin: 0 auto;
            padding: 1.5rem 2rem 4rem;
        }

        .split-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            min-height: 500px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .card-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.15);
        }

        .card-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prompt-input {
            flex: 1;
            padding: 16px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .prompt-input::placeholder { color: var(--text-muted); }

        .controls-bar {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
        }

        .char-count {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .results-panel {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        .optimized-prompt {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            line-height: 1.6;
            color: var(--text-primary);
            white-space: pre-wrap;
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .analysis-pills {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .pill {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(236, 72, 153, 0.1);
            color: var(--accent-light);
            border: 1px solid var(--border);
        }

        .pill-score {
            font-weight: 800;
            margin-left: 4px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 0.82rem;
            font-weight: 500;
            box-shadow: var(--shadow);
            transform: translateX(120%);
            transition: transform 0.3s;
            z-index: 200;
        }
        .toast.show { transform: translateX(0); }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-pulse { animation: pulse 2s infinite; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">✨</div>
                <span class="logo-text">PromptForge</span>
                <span class="logo-badge">Optimizer</span>
            </div>
            <div class="header-actions">
                <button class="btn btn-ghost" onclick="clearAll()">🗑 Clear</button>
            </div>
        </div>
    </header>

    <div class="main">
        <div class="split-layout">
            <!-- Input -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">📝 Your Prompt</span>
                </div>
                <textarea class="prompt-input" id="inputPrompt" placeholder="Enter a prompt to optimize (e.g., 'Write a story about a cat')..." oninput="updateCount()"></textarea>
                <div class="controls-bar">
                    <span class="char-count" id="charCount">0 chars</span>
                    <button class="btn btn-primary" onclick="optimize()">🚀 Optimize</button>
                </div>
            </div>

            <!-- Output -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">✨ Optimized Version</span>
                </div>
                <div class="results-panel" id="resultsPanel">
                    <div class="empty-state">
                        <div class="empty-icon">💡</div>
                        <p>Result will appear here</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function updateCount() {
            const len = document.getElementById('inputPrompt').value.length;
            document.getElementById('charCount').textContent = `${len} chars`;
        }

        function optimize() {
            const input = document.getElementById('inputPrompt').value.trim();
            if (!input) return showToast('⚠️ Please enter a prompt first.');

            const panel = document.getElementById('resultsPanel');
            panel.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon animate-pulse">⚙️</div>
                    <p>Optimizing prompt...</p>
                </div>
            `;

            setTimeout(() => {
                const optimized = generateOptimized(input);
                const score = Math.floor(Math.random() * 20) + 80;
                
                panel.innerHTML = `
                    <div class="analysis-pills">
                        <div class="pill">Clarity <span class="pill-score">92%</span></div>
                        <div class="pill">Creativity <span class="pill-score">88%</span></div>
                        <div class="pill">Detail <span class="pill-score">${score}%</span></div>
                    </div>
                    <div class="optimized-prompt" id="optText">${optimized}</div>
                    <div style="margin-top:16px; display:flex; gap:10px; justify-content:flex-end;">
                        <button class="btn btn-ghost" onclick="copyResult()">📋 Copy</button>
                    </div>
                `;
                showToast('✅ Prompt optimized!');
            }, 1000);
        }

        function generateOptimized(text) {
            // diverse mock logic
            const prefixes = ["Act as an expert storyteller.", "You are a senior developer.", "Imagine a futuristic world."];
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            return `${prefix} Based on the following request: "${text}", please provide a comprehensive, detailed, and creative response. Ensure you cover all key aspects, consider edge cases, and use a professional tone. 

Additional context: The user is looking for high-quality output suitable for a professional setting.`;
        }

        function clearAll() {
            document.getElementById('inputPrompt').value = '';
            document.getElementById('resultsPanel').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">💡</div>
                    <p>Result will appear here</p>
                </div>
            `;
            updateCount();
            showToast('🗑 Cleared');
        }

        function copyResult() {
            const text = document.getElementById('optText').textContent;
            navigator.clipboard.writeText(text);
            showToast('📋 Copied!');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
